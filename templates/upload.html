<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Artwork</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #ff40bd;
      color: #fff42c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 30px;
      text-align: center;
    }

    .upload-container {
      background: #fff;
      color: #9c4de2;
      padding: 40px;
      border-radius: 30px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 360px;
      text-align: center;
    }

    .upload-box {
      width: 100%;
      background-color: #f4edfc;
      border-radius: 20px;
      padding: 20px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 10px;
    }

    .upload-box:hover {
      background-color: #e7d5fb;
    }

    .upload-box span {
      font-size: 1rem;
      color: #9c4de2;
      font-weight: 600;
      display: block;
    }

    input[type="file"] {
      display: none;
    }

    .preview-img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 10px;
      display: none;
    }

    .file-name {
      font-size: 0.9rem;
      color: #5c26a5;
      margin-top: 8px;
    }

    .submit-btn {
      background-color: #9c4de2;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .submit-btn:hover {
      background-color: #7b35c8;
    }

    .results {
      margin-top: 30px;
      color: #fff;
      text-align: center;
    }

    .results img {
      max-width: 250px;
      margin-top: 15px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.25);
    }

    .results ul {
      list-style: none;
      padding: 0;
      margin: 10px 0;
    }

    .results li {
      font-size: 1rem;
      margin: 6px 0;
    }
  </style>
</head>
<body>

  <h1>Upload Your Artwork</h1>

  <div class="upload-container">
    <!-- Updated Upload Section -->
    <form action="/upload" method="post" enctype="multipart/form-data">
      <div class="upload-box">
        <span>Click here to select an image</span>
        <input type="file" id="fileInput" name="image" accept="image/*" />
      </div>      

      <img id="preview" class="preview-img" />
      <div class="file-name" id="fileName"></div>
      
      <button type="submit" class="submit-btn">Upload Now</button>
    </form>
  </div>

  {% if predictions %}
  <div class="results">
    <h2>🎨 Prediction Results</h2>
    <ul>
      {% for label, score in predictions %}
        <li><strong>{{ label }}</strong> — {{ score }}%</li>
      {% endfor %}
    </ul>
    <img src="{{ url_for('static', filename='uploads/' + filename) }}" alt="Uploaded Image" />
  </div>
  {% endif %}

  <script>
    const fileInput = document.getElementById('fileInput');
    const uploadBox = document.querySelector('.upload-box');
    const preview = document.getElementById('preview');
    const fileName = document.getElementById('fileName');

    uploadBox.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function () {
          preview.src = reader.result;
          preview.style.display = 'block';
          fileName.textContent = file.name;
        };
        reader.readAsDataURL(file);
      } else {
        preview.style.display = 'none';
        fileName.textContent = '';
      }
    });
  </script>

</body>
</html>
